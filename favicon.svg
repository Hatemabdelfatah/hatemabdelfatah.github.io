<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0d1a12"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#00e87a" stroke-width="3" opacity="0.5"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00e87a" stroke-width="1" opacity="0.2"/>

  <!-- Corner tick marks like a terminal/cyber aesthetic -->
  <line x1="256" y1="16" x2="256" y2="40" stroke="#00e87a" stroke-width="4" opacity="0.7"/>
  <line x1="496" y1="256" x2="472" y2="256" stroke="#00e87a" stroke-width="4" opacity="0.7"/>
  <line x1="256" y1="496" x2="256" y2="472" stroke="#00e87a" stroke-width="4" opacity="0.7"/>
  <line x1="16" y1="256" x2="40" y2="256" stroke="#00e87a" stroke-width="4" opacity="0.7"/>

  <!-- "HA" text centered -->
  <text x="256" y="300" 
        font-family="'Share Tech Mono', 'Courier New', monospace" 
        font-size="180" 
        font-weight="bold"
        fill="#00e87a"
        text-anchor="middle"
        filter="url(#glow)"
        letter-spacing="-8">HA</text>

  <!-- Underline accent -->
  <rect x="156" y="320" width="200" height="3" rx="2" fill="#00e87a" opacity="0.6"/>
</svg>
